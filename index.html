<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maiara Borges | Product Designer</title>
<meta name="description" content="Maiara Borges, Product Designer em Porto Velho. UX, UI, IA, realidade aumentada e smartwatch.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Maiara Borges | Product Designer">
<meta property="og:description" content="Portfólio de Maiara Borges, Product Designer em Porto Velho.">
<meta property="og:image" content="img/mai-home.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, warm, confident; a designer's own studio page
   IDEA: a designer's notebook, soft charcoal ink on peony paper
   PICTURE: Mai's portrait under a soft arch, wood-ring drawings for the work
   COLOUR and TYPE: Mist / Peony / Mauve / Sage / Charcoal; Google Sans Flex only
   LAYOUT: sticky name bar, wide hero, then full-screen case studies */

/* =========================================================
   CORES — paleta Soft & Feminine (claro e escuro)
   Mist #F4F3F1 · Peony #F2D1D4 · Mauve #D8959B · Sage #829672 · Carvão #262224 (no lugar do verde)
   ========================================================= */
:root{
  --bg:#FFFFFF; --surface:#F4F3F1; --soft:#F2D1D4; --mauve:#D8959B; --sage:#829672;
  --primary:#262224; --on-primary:#F4F3F1; --ink:#1E1B1D; --muted:#625C5F; --line:#E7E3E1;
  --typed:#A35A63; --tile:#262224; --on-tile:#F2D1D4; --role:#94525C; --cta-bg:#F2D1D4; --cta-ink:#262224;
  --font:"Google Sans Flex","Google Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --r-lg:28px; --r-md:18px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#171517; --surface:#221F22; --soft:#2F2A2E; --mauve:#D8959B; --sage:#A7B895;
    --primary:#F2D1D4; --on-primary:#262224; --ink:#F4F3F1; --muted:#BDB5B9; --line:#363034;
    --typed:#E7AEB4; --tile:#F2D1D4; --on-tile:#262224; --role:#E7AEB4; --cta-bg:#D8959B; --cta-ink:#1E1B1D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171517; --surface:#221F22; --soft:#2F2A2E; --mauve:#D8959B; --sage:#A7B895;
  --primary:#F2D1D4; --on-primary:#262224; --ink:#F4F3F1; --muted:#BDB5B9; --line:#363034;
  --typed:#E7AEB4; --tile:#F2D1D4; --on-tile:#262224; --role:#E7AEB4; --cta-bg:#D8959B; --cta-ink:#1E1B1D; color-scheme:dark;
}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--font);-webkit-font-smoothing:antialiased;overflow-x:clip}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--mauve);outline-offset:3px;border-radius:8px}
h1,h2,h3{font-weight:500;letter-spacing:-.03em;line-height:1.06;margin:0;text-wrap:balance}
p{margin:0}
.wrap{width:min(1180px,100% - 40px);margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- HEADER ---------- */
.nav{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent}
.nav.scrolled{border-bottom-color:var(--line)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;height:72px}
.brand{text-decoration:none;font-size:19px;font-weight:500;letter-spacing:-.02em;white-space:nowrap}
.links{display:flex;gap:4px;list-style:none;margin:0;padding:0}
.links a{display:block;text-decoration:none;padding:10px 12px;color:var(--muted);font-size:15px;border-radius:10px}
.links a:hover,.links a[aria-current="page"]{color:var(--ink)}
.links a[aria-current="page"]{text-decoration:underline;text-underline-offset:7px;text-decoration-thickness:1px}
.tools{display:flex;gap:10px;align-items:center}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;padding:6px 11px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);min-width:44px;min-height:36px}
.lang button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center}
.mob{display:none;align-items:center;gap:2px}
.mob a{text-decoration:none;color:var(--muted);padding:10px 8px}
.menu-btn{background:none;border:0;width:44px;height:44px;display:grid;place-items:center}
@media (max-width:900px){.links,.tools{display:none}.mob{display:flex}}

.overlay{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.overlay.open{opacity:1;visibility:visible}
.overlay-top{display:flex;justify-content:space-between;align-items:center;height:72px}
.overlay nav{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto}
.overlay ul{list-style:none;margin:0;padding:24px 0;display:flex;flex-direction:column;align-items:center;gap:clamp(12px,4vh,36px)}
.overlay li a{font-size:clamp(34px,9vw,50px);font-weight:500;letter-spacing:-.03em;text-decoration:none;color:var(--muted)}
.overlay li a[aria-current="page"]{color:var(--ink)}
.overlay-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0 28px;border-top:1px solid var(--line)}
.pill-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:none;border-radius:999px;padding:10px 16px;font-size:15px;min-height:44px}

/* ---------- PAGES ---------- */
.page{display:none;padding:40px 0 96px}
#p-inicio{padding-top:0}
.page.active{display:block;animation:rise .5s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page-head{max-width:760px;margin-bottom:44px}
.page-head h1{font-size:clamp(44px,7vw,88px)}
.page-head p{margin-top:16px;color:var(--muted);font-size:19px;max-width:60ch}
.section{margin-top:88px}
.section-title{font-size:clamp(30px,4.4vw,48px);margin-bottom:14px}
.lead{color:var(--muted);font-size:18px;max-width:62ch}

/* ---------- HOME HERO ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:clamp(28px,5vw,64px);align-items:center;align-content:center;min-height:calc(100svh - 72px);padding:24px 0 48px;max-width:1080px;margin-inline:auto}
.hero h1{font-size:clamp(34px,4.2vw,54px);line-height:1.1;min-height:4.4em}
.typed{color:var(--typed);white-space:nowrap}
.caret{display:inline-block;width:2px;height:.82em;margin-left:4px;background:var(--typed);vertical-align:-.05em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hero-sub{margin-top:20px;font-size:18px;color:var(--muted);max-width:52ch}
.hero-sub strong{color:var(--ink);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:14px 22px;font-weight:600;text-decoration:none;border:1.5px solid transparent;min-height:48px;font-size:16px}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-line{border-color:var(--line);color:var(--ink);background:transparent}
.btn-line:hover{border-color:var(--ink)}
.portrait{position:relative;justify-self:end;width:min(100%,330px)}
.portrait::before{content:"";position:absolute;inset:9% -7% -5% 12%;background:var(--soft);border-radius:999px 999px 32px 32px}
.portrait img{position:relative;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:999px 999px 28px 28px}
.portrait .tag{position:absolute;left:-14px;bottom:28px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:9px 15px;font-size:14px;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px -14px rgba(30,27,29,.35)}
.portrait .tag i{width:9px;height:9px;border-radius:50%;background:var(--sage)}
@media (max-width:860px){.hero{grid-template-columns:1fr;min-height:0}.hero h1{min-height:0}.hero .pin{justify-self:center}}
.hero .pin{justify-self:center;scale:1.25}
.about .pin{scale:1.12}
@media (max-width:860px){.hero .pin,.about .pin{scale:1}}

/* ---------- FOTO PRESA COM CLIPE ---------- */
.pin{position:relative;width:340px;height:370px;margin:0;flex:none;color:var(--muted)}
.pin-lines{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round}
.paper{position:absolute;left:80px;top:66px;width:180px;padding:10px 10px 24px;background:#fff;box-shadow:0 16px 32px -14px rgba(30,27,29,.4),0 2px 5px rgba(30,27,29,.1);transform:rotate(-3deg);transition:transform .4s}
.pin:hover .paper{transform:rotate(-1deg) translateY(-2px)}
.paper img{width:160px;height:200px;object-fit:cover}
.clip{position:absolute;left:96px;top:36px;width:30px;height:84px;transform:rotate(-14deg);color:#8E9088;z-index:2}
.note{position:absolute;font-family:"Caveat",cursive;font-weight:600;font-size:22px;line-height:1;color:var(--ink);white-space:nowrap}
.n1{left:2px;top:18px}.n2{right:0;top:4px}.n3{right:0;top:312px}.n4{left:0;top:256px}
.script{font-family:"Caveat",cursive;font-weight:600;font-size:clamp(40px,5vw,56px);line-height:1;color:var(--typed);margin-bottom:14px}

/* ---------- FEATURED / CARDS ---------- */
.feature{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0;background:var(--surface);border-radius:var(--r-lg);overflow:hidden;text-decoration:none;color:inherit;transition:transform .35s}
.feature:hover{transform:translateY(-4px)}
.feature .art{min-height:340px}
.feature .txt{padding:clamp(24px,4vw,48px);display:flex;flex-direction:column;justify-content:center;gap:14px}
.feature h3{font-size:clamp(28px,3.4vw,42px)}
.feature p{color:var(--muted)}
.meta-line{font-size:15px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:14px;background:var(--bg)}
.go{margin-top:6px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
@media (max-width:760px){.feature{grid-template-columns:1fr}.feature .art{min-height:240px}}
.art svg{width:100%;height:100%;display:block}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.card{display:block;text-decoration:none;color:inherit}
.card .art{aspect-ratio:4/3;border-radius:var(--r-lg);overflow:hidden;transition:border-radius .35s}
.card:hover .art{border-radius:40px}
.card h3{font-size:23px;margin-top:16px}
.card p{color:var(--muted);font-size:16px;margin-top:6px}
.soon{border:1.5px dashed var(--line);border-radius:var(--r-lg);aspect-ratio:4/3;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.soon strong{display:block;color:var(--ink);font-weight:500;font-size:20px;margin-bottom:4px}

.thrive{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.thrive{grid-template-columns:1fr}}
.thrive article{background:var(--surface);border-radius:var(--r-md);padding:26px}
.thrive h3{font-size:24px}
.thrive p{color:var(--muted);margin:8px 0 16px}
.thrive .dot{width:36px;height:36px;border-radius:50%;margin-bottom:18px;background:var(--soft);display:grid;place-items:center}
.thrive .dot svg{width:18px;height:18px;stroke:var(--primary)}

.cta{margin-top:96px;background:var(--cta-bg);color:var(--cta-ink);border-radius:var(--r-lg);padding:clamp(32px,6vw,72px);position:relative;overflow:hidden}
.cta h2{font-size:clamp(34px,5.4vw,64px);max-width:14ch;position:relative}
.cta p{margin-top:16px;max-width:52ch;opacity:.88;font-size:18px;position:relative}
.cta .actions{position:relative}
.cta .btn-primary{background:var(--cta-ink);color:var(--cta-bg)}
.cta .btn-line{border-color:color-mix(in srgb,var(--cta-ink) 40%,transparent);color:var(--cta-ink)}
.cta-mail{display:block;margin-top:14px;font-size:15px;opacity:.8;position:relative}

/* ---------- PROJECT PAGE ---------- */
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-size:15px;padding:10px 0;min-height:44px}
.back:hover{color:var(--ink)}
.case-head{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:end;margin:10px 0 36px}
.case-head h1{font-size:clamp(46px,8vw,104px)}
.case-head .intro{font-size:20px;color:var(--muted)}
@media (max-width:860px){.case-head{grid-template-columns:1fr;gap:18px}}
.case-cover{border-radius:var(--r-lg);overflow:hidden;height:clamp(260px,46vw,540px)}
.facts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;padding:22px 0;border-bottom:1px solid var(--line);margin-bottom:56px}
.facts dt{font-size:14px;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:600}
@media (max-width:760px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.numbers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:72px}
.numbers div{background:var(--surface);border-radius:var(--r-md);padding:22px}
.numbers b{display:block;font-size:clamp(30px,3.6vw,44px);font-weight:500;letter-spacing:-.03em;line-height:1.1;color:var(--primary)}
.numbers span{display:block;color:var(--muted);font-size:15px;margin-top:6px}
.numbers + .src{margin:-58px 0 72px;font-size:14px;color:var(--muted)}
@media (max-width:860px){.numbers{grid-template-columns:repeat(2,minmax(0,1fr))}}
.block{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;padding:30px 0;border-top:1px solid var(--line)}
.block h2{font-size:24px}
.block p+p{margin-top:14px}
.block p,.block li{color:var(--muted);font-size:18px;max-width:66ch}
.block ul{margin:0;padding-left:20px;display:grid;gap:8px}
@media (max-width:700px){.block{grid-template-columns:1fr;gap:10px}}
.gallery-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:80px 0 22px}
.gallery-head h2{font-size:clamp(28px,3.6vw,40px)}
.gallery-head p{color:var(--muted);font-size:15px}
.phones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
@media (max-width:860px){.phones{grid-template-columns:repeat(2,minmax(0,1fr))}}
.phone{background:var(--surface);border-radius:34px;padding:10px;aspect-ratio:9/19}
.phone .scr,.browser .scr,.photo .scr,.polaroid .scr{width:100%;height:100%;border-radius:26px;overflow:hidden;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:14px;padding:14px;background:repeating-linear-gradient(-45deg,transparent 0 12px,color-mix(in srgb,var(--line) 70%,transparent) 12px 13px),var(--bg);border:1.5px dashed var(--line)}
.scr{position:relative}
.scr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.has-img .scr{padding:0;border:0;background:none}
.figcap{font-size:14px;color:var(--muted);margin-top:10px;text-align:center}
.browsers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
@media (max-width:760px){.browsers{grid-template-columns:1fr}}
.browser{background:var(--surface);border-radius:20px;padding:0 8px 8px}
.browser .bar{height:34px;display:flex;align-items:center;gap:6px;padding-left:8px}
.browser .bar i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.browser .scr{aspect-ratio:16/10;height:auto;border-radius:13px}
.photos{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:18px}
@media (max-width:760px){.photos{grid-template-columns:1fr 1fr}.photos .photo:first-child{grid-column:1/-1}}
.photo .scr{aspect-ratio:4/5;border-radius:22px}
.photos .photo:first-child .scr{aspect-ratio:auto;height:100%;min-height:260px}
.refs{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.refs a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:20px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.refs a:hover{background:var(--surface)}
.refs b{font-weight:500;font-size:19px;display:block}
.refs span{color:var(--muted);font-size:15px}
.end-nav{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;margin-top:56px}

/* ---------- SOBRE ---------- */
.about{display:grid;grid-template-columns:340px minmax(0,1fr);gap:clamp(40px,8vw,120px);align-items:center}
@media (max-width:860px){.about{grid-template-columns:1fr}.about .pin{justify-self:center}}
.about-text p{font-size:19px;margin-bottom:18px;max-width:58ch}
.about-photo{position:relative;width:min(100%,360px);justify-self:end}
.about-photo::before{content:"";position:absolute;inset:-18px 18% 18% -18px;background:var(--soft);border-radius:var(--r-lg)}
.about-photo img{position:relative;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:var(--r-lg)}
@media (max-width:860px){.about-photo{order:-1;width:min(100%,280px);justify-self:start}.about-photo::before{inset:-12px 14% 14% -12px}}
.life{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:760px){.life{grid-template-columns:1fr 1fr}.life .polaroid:first-child{grid-column:1/-1}.life .polaroid:first-child .scr{aspect-ratio:16/10}}
.polaroid{background:var(--surface);border-radius:20px;padding:12px 12px 16px;transition:transform .3s}
.polaroid:nth-child(odd){transform:rotate(-1.2deg)}.polaroid:nth-child(even){transform:rotate(1deg)}
.polaroid:hover{transform:none}
.polaroid .scr{aspect-ratio:1/1;height:auto;border-radius:12px}
.polaroid p{margin-top:12px;font-size:15px}
.polaroid p span{display:block;color:var(--muted);font-size:14px}

.timeline{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.timeline > li{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:20px;padding:26px 0;border-bottom:1px solid var(--line)}
@media (max-width:640px){.timeline > li{grid-template-columns:52px minmax(0,1fr)}.timeline .when{grid-column:2;grid-row:2}}
.logo{width:56px;height:56px;border-radius:16px;background:var(--tile);color:var(--on-tile);display:grid;place-items:center;font-weight:600;font-size:19px;letter-spacing:-.02em;overflow:hidden}
@media (max-width:640px){.logo{width:48px;height:48px;border-radius:14px;font-size:17px}}
img.logo{background:#fff;object-fit:contain;padding:7px;border:1px solid var(--line)}
.timeline h3{font-size:22px;letter-spacing:-.02em}
.timeline .role{color:var(--role);font-weight:600;font-size:16px;margin-top:2px}
.timeline .where{color:var(--muted);font-size:15px}
.timeline .when{color:var(--muted);font-size:15px;white-space:nowrap;text-align:right}
@media (max-width:640px){.timeline .when{text-align:left;white-space:normal}}
.timeline ul{margin:12px 0 0;padding-left:18px;display:grid;gap:6px}
.timeline li li,.timeline .desc{color:var(--muted);font-size:16px;max-width:70ch}
.timeline .desc{margin-top:10px}
.cert{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:9px 16px;border:1px solid var(--line);border-radius:999px;text-decoration:none;font-weight:500;font-size:15px;min-height:42px}
.cert:hover{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.cert.pending{color:var(--muted);border-style:dashed}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px}
@media (max-width:860px){.two{grid-template-columns:1fr}}

/* ---------- CONTATO ---------- */
.contact{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(32px,6vw,88px);align-items:start}
@media (max-width:860px){.contact{grid-template-columns:1fr}}
.contact h1{font-size:clamp(44px,6.4vw,80px)}
.contact .lead{margin-top:18px}
.reach{list-style:none;margin:32px 0 0;padding:0;border-top:1px solid var(--line)}
.reach li{display:flex;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.reach span{color:var(--muted);font-size:15px}
.reach a{font-weight:500;text-decoration:none;overflow-wrap:anywhere}
.reach a:hover{text-decoration:underline}
.form-card{background:var(--cta-bg);color:var(--cta-ink);border-radius:var(--r-lg);padding:clamp(22px,4vw,44px)}
.field{display:grid;gap:7px;margin-bottom:18px}
.field label{font-weight:600;font-size:15px}
.field input,.field textarea,.field select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid transparent;border-radius:14px;padding:13px 15px;min-height:50px;width:100%}
.field textarea{min-height:150px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--cta-ink)}
.field [aria-invalid="true"]{border-color:#B3261E}
.err{font-size:14px;color:#8F1D17;min-height:0}
:root[data-theme="dark"] .err{color:#3B0A07}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.form-card .btn-primary{background:var(--cta-ink);color:var(--cta-bg);width:100%;margin-top:4px}
.form-note{font-size:14px;margin-top:14px;opacity:.85}
.done{display:none}
.form-card.sent form{display:none}
.form-card.sent .done{display:block}
.done h2{font-size:clamp(28px,3.4vw,38px)}
.done p{margin-top:12px}
.done pre{white-space:pre-wrap;background:var(--bg);color:var(--ink);border-radius:14px;padding:16px;font:15px/1.55 var(--font);margin:16px 0;max-height:220px;overflow:auto}
.done .actions .btn-line{border-color:color-mix(in srgb,var(--cta-ink) 40%,transparent);color:var(--cta-ink)}

/* ---------- INSPIRAÇÃO / ÍNDICE ---------- */
.insp{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.insp li > *{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:16px;align-items:center;padding:22px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.insp a:hover{background:var(--surface)}
.insp .k{color:var(--muted);font-size:15px}
.insp .t{font-weight:500;font-size:clamp(20px,2.6vw,28px);letter-spacing:-.02em}
.insp .why{grid-column:2/-1;color:var(--muted);font-size:15px;margin-top:-8px}
@media (max-width:600px){.insp li > *{grid-template-columns:minmax(0,1fr) auto}.insp .k{grid-column:1/-1}.insp .why{grid-column:1/-1;margin-top:0}}
.table-wrap{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:16px 18px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;font-size:15px;color:var(--muted);background:var(--surface)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface)}
tbody tr:last-child td{border-bottom:0}
td.name a{font-weight:600;text-decoration:none}
@media(max-width:600px){table{font-size:15px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 16px;padding-inline-start:calc(16px + 6.5em)}.stack td::before{content:attr(data-l);float:inline-start;width:6em;margin-inline-start:-6.5em;color:var(--muted)}}

footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--muted);font-size:15px}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
.foot a{text-decoration:none;margin-left:16px}
.foot a:first-child{margin-left:0}
.foot a:hover{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:500;z-index:90;transition:transform .35s;visibility:hidden}
.toast.show{transform:translate(-50%,0);visibility:visible}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
const merge = (b, o) => {
  if (o === undefined) return b;
  if (Array.isArray(b) && Array.isArray(o)) return (b.length && isObj(b[0])) ? b.map((x,i) => merge(x, o[i])) : o;
  if (isObj(b) && isObj(o)) { const r = {...b}; for (const k in o) r[k] = merge(b[k], o[k]); return r; }
  return o;
};

  document.title = `${p.titulo} | ${C.nome}`;
}

const tl = (arr, withCert, curso) => arr.map(t => `<li>
  ${logo(t)}
  <div>
    <h3>${esc(curso ? t.papel : t.empresa)}</h3>
    <p class="role">${esc(curso ? t.empresa : t.papel)}</p>
    ${t.local ? `<p class="where">${esc(t.local)}</p>` : ''}
    ${t.itens ? (t.itens.length > 1 ? `<ul>${t.itens.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : `<p class="desc">${esc(t.itens[0])}</p>`) : ''}
    ${t.texto ? `<p class="desc">${esc(t.texto)}</p>` : ''}
    ${withCert ? (t.certificado ? `<a class="cert" href="${esc(t.certificado)}" target="_blank" rel="noopener">${esc(T.cert)} <span aria-hidden="true">↗</span></a>` : `<span class="cert pending">${esc(T.certSoon)}</span>`) : ''}
  </div>
  <span class="when">${esc(t.quando)}</span></li>`).join('');

let typeTimer;
function startTyping(){
  clearTimeout(typeTimer);
  const words = C.heroPalavras, el = $('#typed');
  $('#heroA').textContent = C.heroInicio; $('#heroB').textContent = C.heroFim;
  $('#heroTitle').setAttribute('aria-label', `${C.heroInicio} ${words[0].replace(/_/g,' ')} ${C.heroFim}`);
  let w = 0, i = 0, del = false;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const swap = () => { el.textContent = words[w]; w = (w+1) % words.length; typeTimer = setTimeout(swap, 2600); };
    return swap();
  }
  const tick = () => {
    const word = words[w]; i += del ? -1 : 1; el.textContent = word.slice(0, i);
    let wait = del ? 45 : 90;
    if (!del && i === word.length) { del = true; wait = 1800; }
    else if (del && i === 0) { del = false; w = (w+1) % words.length; wait = 350; }
    typeTimer = setTimeout(tick, wait);
  };
  el.textContent = ''; tick();
}

function render(){
  C = lang === 'en' ? merge(CONTEUDO, CONTEUDO_EN) : CONTEUDO;
  T = TEXTOS[lang];
  applyUI();
  startTyping();
  $('#heroSub').innerHTML = C.heroSub;
  $('#heroPin').outerHTML = pin('h', C.foto, T.heroNotes, T.photoAlt);
  $('#aboutPin').outerHTML = pin('s', C.fotoSobre, T.aboutNotes, T.photoAlt2);
  $('#ctaText').textContent = C.cta;
  $('#reach').innerHTML = [{nome:'E-mail',url:`mailto:${C.email}`,txt:C.email},...C.redes.map(r=>({...r,txt:r.url.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,'')}))].map(r=>`<li><span>${esc(r.nome)}</span><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.txt)}</a></li>`).join('');
  $('#f-assunto').innerHTML = T.subjects.map(x=>`<option>${esc(x)}</option>`).join('');
  $('#ctaMail').textContent = C.email;
  $('#copy').textContent = `© ${new Date().getFullYear()} ${C.nome}, ${C.cidade}`;
  $('#socials').innerHTML = C.redes.map(r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.nome)}</a>`).join('');

  const f = C.projetos[0];
  $('#featured').innerHTML = `<a class="feature" href="#${f.slug}"><div class="art">${woodArt()}</div>
    <div class="txt"><p class="meta-line">${esc(f.empresa)} · ${f.ano}</p><h3>${esc(f.titulo)}</h3><p>${esc(f.resumo)}</p>
    <div class="chips">${f.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>
    <span class="go">${esc(T.openCase)} <span aria-hidden="true">→</span></span></div></a>`;
  $('#thrive').innerHTML = C.destaques.map((d,i)=>`<article><div class="dot">${icons[i]}</div><h3>${esc(d.titulo)}</h3><p>${esc(d.resumo)}</p><div class="chips">${d.itens.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div></article>`).join('');

  $('#grid').innerHTML = C.projetos.map(cardHTML).join('') + `<div class="soon"><div><strong>${esc(T.soonTitle)}</strong>${esc(T.soonText)}</div></div>`;

  $('#aboutText').innerHTML = C.sobre.map(t=>`<p>${esc(t)}</p>`).join('');
  $('#life').innerHTML = C.fotosVida.map(v=>`<figure class="polaroid${v.src?' has-img':''}" style="margin:0"><div class="scr">${v.src?`<img src="${esc(v.src)}" alt="${esc(v.titulo)}" loading="lazy">`:`<span>${esc(T.slotHint)}</span>`}</div><p>${esc(v.titulo)}${v.legenda?`<span>${esc(v.legenda)}</span>`:''}</p></figure>`).join('');
  $('#timeline').innerHTML = tl(C.trajetoria, false);
  $('#education').innerHTML = tl(C.formacao, true);
  $('#courses').innerHTML = tl(C.cursos, true, true);
  $('#skills').innerHTML = C.competencias.map(s=>`<span class="chip">${esc(s)}</span>`).join('');
  $('#tools').innerHTML = C.ferramentas.map(s=>`<span class="chip">${esc(s)}</span>`).join('');

  $('#insp').innerHTML = C.inspiracao.map(x=>{
    const inner = `<span class="k">${esc(x.tipo)}</span><span class="t">${esc(x.titulo)}</span><span class="k">${esc(x.autor)}</span><span class="why">${esc(x.porque)}</span>`;
    return `<li>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${inner}</a>`:`<div>${inner}</div>`}</li>`;
  }).join('');
  $('#tbody').innerHTML = C.projetos.map(p=>`<tr data-slug="${p.slug}"><td>${p.ano}</td><td class="name"><a href="#${p.slug}">${esc(p.titulo)}</a></td><td>${esc(p.empresa)}</td><td>${esc(p.area)}</td><td>${esc(p.papel)}</td></tr>`).join('');
  $$('.stack td').forEach(c=>c.dataset.l = c.closest('table').rows[0].cells[c.cellIndex].textContent);
  route(false);
}

/* ---------- Rotas (#projetos, #sobre, #wood-identification…) ---------- */
const pages = ['inicio','projetos','sobre','inspiracao','indice','contato'];
function route(scroll = true){
  const h = location.hash.slice(1);
  const proj = C.projetos.find(p => p.slug === h);
  const id = proj ? 'case' : (pages.includes(h) ? h : 'inicio');
  $$('.page').forEach(p => p.classList.toggle('active', p.id === 'p-' + id));
  if (proj) renderCase(proj); else document.title = `${C.nome} | Product Designer`;
  const cur = proj ? 'projetos' : id;
  $$('[data-r]').forEach(a => a.dataset.r === cur ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
  if (overlay.classList.contains('open')) setMenu(false);
  if (scroll) window.scrollTo({top:0});
}
window.addEventListener('hashchange', () => route(true));
document.addEventListener('click', e => {
  const r = e.target.closest('tbody tr[data-slug]'); if (r && !e.target.closest('a')) location.hash = r.dataset.slug;
});

/* ---------- Menu ---------- */
const overlay = $('#overlay');
function setMenu(open){
  overlay.classList.toggle('open', open); overlay.setAttribute('aria-hidden', !open);
  $('#menuBtn').setAttribute('aria-expanded', open); document.body.style.overflow = open ? 'hidden' : '';
  if (open) $('#closeMenu').focus();
}
$('#menuBtn').addEventListener('click', () => setMenu(true));
$('#closeMenu').addEventListener('click', () => setMenu(false));
overlay.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
overlay.addEventListener('click', e => { if (e.target.closest('a')) setMenu(false); });

/* ---------- Idioma ---------- */
$$('.lang button').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.lang === lang) return;
  lang = b.dataset.lang; try { localStorage.setItem('idioma', lang); } catch(e) {}
  render();
}));

/* ---------- Tema ---------- */
const curTheme = () => document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
function updateThemeText(){ $$('.theme-text').forEach(el => el.textContent = curTheme() === 'dark' ? T.themeToLight : T.themeToDark); }
try { const t = localStorage.getItem('tema'); if (t) document.documentElement.dataset.theme = t; } catch(e) {}
$$('.theme-toggle').forEach(b => b.addEventListener('click', () => {
  const n = curTheme() === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = n;
  try { localStorage.setItem('tema', n); } catch(e) {}
  updateThemeText();
}));

/* ---------- Contato ---------- */
const form = $('#contactForm'), card = $('#formCard');
let lastMsg = null;
function buildMail(d){
  const subject = `${d.assunto} — ${d.nome}`;
  const body = `${d.mensagem}\n\n${d.nome}\n${d.email}`;
  return { subject, body, href:`mailto:${C.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}` };
}
form.addEventListener('submit', e => {
  e.preventDefault();
  const d = { nome:$('#f-nome').value.trim(), email:$('#f-email').value.trim(), assunto:$('#f-assunto').value, mensagem:$('#f-msg').value.trim() };
  const checks = [['nome', d.nome.length > 1, T.eName, '#f-nome'], ['email', /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email), T.eEmail, '#f-email'], ['msg', d.mensagem.length > 9, T.eMsg, '#f-msg']];
  let first = null;
  checks.forEach(([k, ok, msg, sel]) => { $('#e-'+k).textContent = ok ? '' : msg; $(sel).setAttribute('aria-invalid', !ok); if (!ok && !first) first = $(sel); });
  if (first) { first.focus(); return; }
  lastMsg = buildMail(d);
  $('#donePreview').textContent = `${T.to}: ${C.email}\n${T.subj}: ${lastMsg.subject}\n\n${lastMsg.body}`;
  $('#doneMail').href = lastMsg.href;
  card.classList.add('sent');
  try { window.location.href = lastMsg.href; } catch(err) {}
});
$('#doneCopy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(`${C.email}\n${lastMsg.subject}\n\n${lastMsg.body}`); toast(T.copiedMsg); } catch(e) { toast(C.email); }
});
$('#doneNew').addEventListener('click', () => { form.reset(); card.classList.remove('sent'); $('#f-nome').focus(); });

/* ---------- E-mail ---------- */
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2200); };
$('#copyBtn').addEventListener('click', async () => { try { await navigator.clipboard.writeText(C.email); toast(T.copied); } catch(e) { toast(C.email); } });

const nav = $('#nav');
window.addEventListener('scroll', () => nav.classList.toggle('scrolled', scrollY > 8), {passive:true});

render();
}
</script>
</body>
</html>
